
<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My Space · 我的宇宙</title>
<style>
body {
  margin: 0;
  padding: 24px;
  background: #080d20;
  color: white;
  font-family: sans-serif;
}
main { max-width: 700px; margin: auto; }
img { width: 100%; border-radius: 14px; }
p { line-height: 1.8; color: #ccd3ed; }
input, button {
  padding: 12px;
  margin: 5px 0;
  border-radius: 8px;
}
</style>
</head>
<body>
<main>
<h1>🌌 My Space</h1>
<p>我的宇宙 · 每天探索一点星空</p>
<input id="date" type="date">
<button onclick="loadPhoto()">探索宇宙</button>
<h2 id="title">正在寻找宇宙照片……</h2>
<img id="photo" alt="NASA 太空照片">
<p id="info">请稍候</p>
<p id="status"></p>
<a href="https://apod.nasa.gov/apod/astropix.html">
访问 NASA 官方网站
</a>
</main>
<script>
const dateInput = document.getElementById('date');
const now = new Date();
const today = [
  now.getFullYear(),
  String(now.getMonth()+1).padStart(2,'0'),
  String(now.getDate()).padStart(2,'0')
].join('-');

dateInput.max = today;
dateInput.value = today;

async function loadPhoto() {
  const date = dateInput.value;
  const status = document.getElementById('status');
  status.textContent = '正在连接 NASA……';

  try {
    const url =
      'https://api.nasa.gov/planetary/apod?api_key=DEMO_KEY&date='
      + encodeURIComponent(date);

    const response = await fetch(url);
    if (!response.ok) throw new Error('请求失败：' + response.status);

    const data = await response.json();
    document.getElementById('title').textContent = data.title;
    document.getElementById('info').textContent =
      data.explanation || 'NASA 暂未提供介绍。';

    if (data.media_type === 'image') {
      document.getElementById('photo').src = data.url;
      document.getElementById('photo').alt = data.title;
    } else {
      document.getElementById('photo').removeAttribute('src');
      status.textContent = '当天内容是视频或其他媒体，请访问 NASA 官网查看。';
    }
    if (data.copyright) {
      status.textContent = '图片署名：' + data.copyright;
    } else if (data.media_type === 'image') {
      status.textContent = '图片资料来自 NASA APOD。';
    }
  } catch (error) {
    status.textContent =
      '暂时加载失败。请检查网络，稍后再试。' + error.message;
  }
}

loadPhoto();
</script>
</body>
</html>
